services:
  postgres:
    image: postgres:16
    container_name: seren-legal-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: seren
      POSTGRES_PASSWORD: seren_dev
      POSTGRES_DB: seren_legal
    volumes:
      - seren_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seren -d seren_legal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seren-legal-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - seren_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  seren_postgres_data:
  seren_redis_data:
