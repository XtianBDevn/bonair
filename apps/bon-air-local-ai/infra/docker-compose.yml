services:
  postgres:
    image: postgres:16
    container_name: bon-air-local-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: bonair
      POSTGRES_PASSWORD: bonair
      POSTGRES_DB: bonair_local
    volumes:
      - bonair_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonair -d bonair_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bon-air-local-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - bonair_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  bonair_postgres_data:
  bonair_redis_data:
